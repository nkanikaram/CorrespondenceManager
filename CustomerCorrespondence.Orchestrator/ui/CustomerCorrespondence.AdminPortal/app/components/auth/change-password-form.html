<form class="auth-form" novalidate ng-submit="$ctrl.submit()" autocomplete="off">
  <div class="auth-alert auth-alert--danger" role="alert" ng-if="$ctrl.error">
    {{ $ctrl.error }}
    <ul class="auth-alert__list" ng-if="$ctrl.problems.length"><li ng-repeat="p in $ctrl.problems track by $index">{{ p }}</li></ul>
  </div>

  <div class="form-field">
    <label class="field-label" for="cp-current">{{ $ctrl.forced ? 'Temporary password' : 'Current password' }}</label>
    <input id="cp-current" type="password" class="input" autocomplete="current-password" required ng-model="$ctrl.form.current" cc-focus-when="true">
  </div>

  <div class="form-field">
    <label class="field-label" for="cp-next">New password</label>
    <input id="cp-next" type="password" class="input" autocomplete="new-password" required maxlength="128" ng-model="$ctrl.form.next"
           aria-describedby="cp-rules">
    <ul class="password-rules" id="cp-rules" aria-live="polite">
      <li ng-repeat="r in $ctrl.rules() track by $index" ng-class="{ 'is-ok': r.ok }">
        <span class="password-rules__mark" aria-hidden="true">{{ r.ok ? '✓' : '•' }}</span>{{ r.text }}
        <span class="sr-only">{{ r.ok ? '(met)' : '(not met)' }}</span>
      </li>
    </ul>
  </div>

  <div class="form-field">
    <label class="field-label" for="cp-confirm">Confirm new password</label>
    <input id="cp-confirm" type="password" class="input" autocomplete="new-password" required ng-model="$ctrl.form.confirm"
           aria-describedby="cp-confirm-error">
    <div class="form-field__error" id="cp-confirm-error" ng-if="$ctrl.form.confirm && $ctrl.form.confirm !== $ctrl.form.next">The passwords don't match.</div>
  </div>

  <div class="auth-form__actions">
    <button type="button" class="btn btn--secondary" ng-if="$ctrl.onCancel" ng-click="$ctrl.onCancel()">{{ $ctrl.forced ? 'Sign out' : 'Cancel' }}</button>
    <button type="submit" class="btn btn--primary" ng-disabled="$ctrl.busy || !$ctrl.canSubmit()">
      <span class="spinner spinner--sm" ng-if="$ctrl.busy"></span>
      <span>{{ $ctrl.busy ? 'Saving…' : 'Change password' }}</span>
    </button>
  </div>
</form>
