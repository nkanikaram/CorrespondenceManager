<div class="assistant-window" ng-show="$ctrl.open" ng-style="$ctrl.windowStyle()" role="dialog" aria-label="AI Assistant"
     ng-class="{ 'is-docked': $ctrl.docked, 'is-compact': $ctrl.compact && !$ctrl.docked, 'is-interacting': $ctrl.interacting }">
  <div class="assistant-window__bar" ng-mousedown="$ctrl.startMove($event)" title="{{ $ctrl.docked || $ctrl.compact ? '' : 'Drag to move' }}">
    <span class="assistant-window__grip" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="assistant-window__controls">
      <button type="button" class="aw-btn" ng-if="!$ctrl.docked && !$ctrl.compact" ng-mousedown="$event.stopPropagation()" ng-click="$ctrl.restorePosition()"
              title="Restore to the default position and size">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Restore</span></button>
      <button type="button" class="aw-btn" ng-if="$ctrl.docked || $ctrl.canDock()" ng-mousedown="$event.stopPropagation()" ng-click="$ctrl.toggleDock()"
              title="{{ $ctrl.docked ? 'Undock: back to a floating, movable window' : 'Dock to the right edge of the screen' }}">
        <svg ng-if="!$ctrl.docked" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        <svg ng-if="$ctrl.docked" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="11" y="11" width="7" height="6" rx="1"/></svg>
        <span>{{ $ctrl.docked ? 'Undock' : 'Dock right' }}</span></button>
      <button type="button" class="aw-btn aw-btn--icon assistant-window__close" ng-mousedown="$event.stopPropagation()" ng-click="$ctrl.toggleOpen()"
              title="Close the AI Assistant (i)" aria-label="Close the AI Assistant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </span>
  </div>
  <div class="assistant-window__body">
    <assistant-panel></assistant-panel>
  </div>

  <div class="dock-handle" ng-if="$ctrl.docked" ng-mousedown="$ctrl.startDockResize($event)" title="Drag to resize"><span></span></div>
  <div ng-if="!$ctrl.docked && !$ctrl.compact" ng-repeat="h in $ctrl.handles track by h" class="resize-handle" ng-class="'resize-handle--' + h"
       ng-mousedown="$ctrl.startResize(h, $event)" title="Drag to resize"><span></span></div>
</div>

<!-- Launcher: the dolphin in its pool. Hover or focus slides out the label; the dolphin jumps now and then, and when hovered. -->
<button type="button" class="ai-launcher" ng-class="{ 'is-open': $ctrl.open, 'is-covered': $ctrl.open && $ctrl.compact && !$ctrl.docked }" ng-style="$ctrl.launcherStyle()" ng-click="$ctrl.toggleOpen()"
        title="{{ $ctrl.open ? 'Close the AI Assistant (i)' : 'Ask ECCO AI (i)' }}" aria-label="{{ $ctrl.open ? 'Close the AI Assistant' : 'Ask ECCO AI' }}"
        aria-keyshortcuts="i" aria-expanded="{{ !!$ctrl.open }}">
  <span class="ai-launcher__label" ng-if="!$ctrl.open" aria-hidden="true">Ask ECCO AI <kbd class="kbd">i</kbd></span>
  <span class="ai-launcher__orb">
    <svg ng-if="$ctrl.open" class="ai-launcher__close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    <span ng-if="!$ctrl.open" class="ai-launcher__scene" aria-hidden="true">
      <span class="ai-launcher__pool">
        <span class="wave wave--a"></span>
        <span class="wave wave--b"></span>
        <span class="ripple"></span>
        <span class="ripple ripple--late"></span>
      </span>
      <span class="splash splash--left">💦</span>
      <span class="splash splash--right">💦</span>
      <span class="dolphin">🐬</span>
    </span>
  </span>
</button>
