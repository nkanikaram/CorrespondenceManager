          azureSubscription: '${{ parameters.Subscription }}'
          ScriptType: 'InlineScript'
          Inline: | 
              Write-Host "##vso[task.setvariable variable=DEMOSECRET_VALUE1;]$(Get-Content $(PGPPrivateKey.secureFilePath))"
