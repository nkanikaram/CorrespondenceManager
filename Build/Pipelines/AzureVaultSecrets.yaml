trigger: none

parameters:
  - name: Environment
    displayName: "Environment to deploy"
    type: string
    default: DVLP
    values:
      - DVLP
      - DEMO
      - PROD
  - name: Subscription
    displayName: "Subscriptions to use"
    type: string
    default: Corporate NonProd Corporate
    values:
      - Corporate NonProd Corporate
      - Corporate Prod Corporate

variables:
  - ${{ if eq(parameters.Environment, 'DVLP') }}:
    - name: RG_ENVCODE
      value: D03
    - name: PvtKeyFilename
      value: 'PGPPrivateKeyNP.txt'
    - name: PubKeyFilename
      value: 'PGPPublicKeyNP.txt'
    - name: PassphraseFilename
      value: 'PGPPassphraseNP.txt'
    - name: PRIMARY_SUFFIX
      value: M
    - name: SecondaryCCPSafe
      value: 'CCP_ECCO_Safe_$(PRIMARY_SUFFIX)'
    - name: SecondaryCCPAppID
      value: 'CCP_ECCO_App_$(PRIMARY_SUFFIX)'   
  - ${{ if eq(parameters.Environment, 'DEMO') }}:
    - name: RG_ENVCODE
      value: M01
    - name: PvtKeyFilename
      value: 'PGPPrivateKeyNP.txt'
    - name: PubKeyFilename
      value: 'PGPPublicKeyNP.txt'
    - name: PassphraseFilename
      value: 'PGPPassphraseNP.txt'
    - name: PRIMARY_SUFFIX
      value: M
    - name: SecondaryCCPSafe
      value: 'CCP_ECCO_Safe_$(PRIMARY_SUFFIX)'
    - name: SecondaryCCPAppID
      value: 'CCP_ECCO_App_$(PRIMARY_SUFFIX)'
  - ${{ if eq(parameters.Environment, 'PROD') }}:
    - name: RG_ENVCODE
      value: P01
    - name: PvtKeyFilename
      value: 'PGPPrivatekeyPROD.txt'
    - name: PubKeyFilename
      value: 'PGPPublickeyPROD.txt'
    - name: PassphraseFilename
      value: 'PGPPassPhraseProd.txt'
    - name: PRIMARY_SUFFIX
      value: P
    - name: SecondaryCCPSafe
      value: 'CCP_ECCOAPI_Safe_$(PRIMARY_SUFFIX)'
    - name: SecondaryCCPAppID
      value: 'CCP_ECCOAPI_App_$(PRIMARY_SUFFIX)'

  - name: KV_NAME
    value: 'kv-$(RG_ENVCODE)-ECCO'
  - name: RG_APP_NAME
    value: 'RG-CMFG-$(RG_ENVCODE)-ECCO'
  - name: PrimaryCCPSafe
    value: 'CCP_RM-Corporate_Safe_$(PRIMARY_SUFFIX)'
  - name: PrimaryCCPAppID
    value: 'CCP_RM-Corporate_App_$(PRIMARY_SUFFIX)'
  - name: PrimaryCCPObject
    value: 'Non-Managed Accounts-Non-ManagedAIMAccounts-SA-RM-Corporate-$(PRIMARY_SUFFIX)'
  - name: SecondaryCCPObject
    value: 'Non-Managed Accounts-Non-ManagedAIMAccounts-SA-ECCO-$(PRIMARY_SUFFIX)'
  - name: PrimaryServiceAccount
    value: 'SA-RM-Corporate-$(PRIMARY_SUFFIX)'    
  - name: KVSecretName
    value: 'SAECCOM'
  - name: EnableCCPPassword
    value: 'true'
stages:
  - stage: DVLP
    pool: Release-Corporate-NP
    variables:
    - template: Variables/VentureFusionNP.yml
    - template: Variables/KeyVault_Dev.yml  
    jobs:
    # Write Key Vault Secrets
    - job: DVLPWriteKeyVaultSecrets
      steps:
      - checkout: self
        displayName: 'Checkout Repository'
      - task: TruStageReleaseTask@1
        displayName: 'Retrieve Primary Service Account Password from CCP'
        inputs:
          enableCCP: true
          CCPObject: '$(PrimaryCCPObject)'
          CCPSafe: '$(PrimaryCCPSafe)'
          CCPAPPID: '$(PrimaryCCPAppID)'
          CCPReason: 'Retrieve password for release management deployment'
          PasswordVariableName: 'rmSaPwd'
      - task: CCPSAPasswordLookup@1
        displayName: 'Retrieve Secondary Service Account Password from CCP'
        inputs:
          ReleaseUsername: 'cmutual\$(PrimaryServiceAccount)'
          ReleasePassword: '$(rmSaPwd)'
          enableCCP: true
          CCPObject: '$(SecondaryCCPObject)'
          CCPSafe: '$(SecondaryCCPSafe)'
          CCPAPPID: '$(SecondaryCCPAppID)'
          CCPReason: 'Retrieve password to connect Documentum Soap Service'
          PasswordVariableName: 'SAPassword'      
      - task: DownloadSecureFile@1
        name: PGPPrivateKey
        displayName: 'Download PGP Private Key Non Prod'
        inputs:
          secureFile: '$(PvtKeyFilename)'
      - task: DownloadSecureFile@1
        name: PGPPublicKey
        displayName: 'Download PGP Public Key Non Prod'
        inputs:
          secureFile: '$(PubKeyFilename)'
      - task: DownloadSecureFile@1
        name: PGPPassphrase
        displayName: 'Download PGP Passphrase Non Prod'
        inputs:
          secureFile: '$(PassphraseFilename)'
      - task: DownloadSecureFile@1
        name: NServiceBusLicense
        displayName: 'Download NServiceBus License Key'
        inputs:
          secureFile: 'NSBLicense.txt'
      - task: AzurePowerShell@5
        displayName: 'Get contents of secure file: NSBLicense.txt'
        inputs:
          azureSubscription: '${{ parameters.Subscription }}'
          ScriptType: 'InlineScript'
          Inline: |
              Write-Host "##vso[task.setvariable variable=NSB_LICENSE;]$(Get-Content $(NServiceBusLicense.secureFilePath))"
          azurePowerShellVersion: 'LatestVersion'
      - task: AzurePowerShell@5
        displayName: 'Get contents of secure file: $(PvtKeyFilename)'
        inputs:
          azureSubscription: '${{ parameters.Subscription }}'
          ScriptType: 'InlineScript'
          Inline: | 
              Write-Host "##vso[task.setvariable variable=DVLPSECRET_VALUE1;]$(Get-Content $(PGPPrivateKey.secureFilePath))"
          azurePowerShellVersion: 'LatestVersion'
      - task: AzurePowerShell@5
        displayName: 'Get contents of secure file: $(PubKeyFilename)'
        inputs:
          azureSubscription: '${{ parameters.Subscription }}'
          ScriptType: 'InlineScript'
          Inline: | 
              Write-Host "##vso[task.setvariable variable=DVLPSECRET_VALUE2;]$(Get-Content $(PGPPublicKey.secureFilePath))"
          azurePowerShellVersion: 'LatestVersion'
      - task: AzurePowerShell@5
        displayName: 'Get contents of secure file: $(PassphraseFilename)'
        inputs:
          azureSubscription: '${{ parameters.Subscription }}'
          ScriptType: 'InlineScript'
          Inline: | 
              Write-Host "##vso[task.setvariable variable=DVLPSECRET_VALUE3;]$(Get-Content $(PGPPassphrase.secureFilePath))"
          azurePowerShellVersion: 'LatestVersion'
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: PGP Private key'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'PGPPrivateKey'
          SecretValue: $(DVLPSECRET_VALUE1)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: PGP Public key'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'PGPPublicKey'
          SecretValue: $(DVLPSECRET_VALUE2)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: PGP Passphrase'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'PGPPassphrase'
          SecretValue: $(DVLPSECRET_VALUE3)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion TenantID'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFTenantID'
          SecretValue: $(TenantID)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion Scopes'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFScopes'
          SecretValue: $(Scopes)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion ClientID'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFClientID'
          SecretValue: $(ClientID)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion Client Secret'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFClientSecret'
          SecretValue: $(ClientSecret)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion Customer ID'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFCustomerID'
          SecretValue: $(CustomerID)
      # - task: cboroson-WriteSecrets@1
      #   displayName: 'Write Secret: VentureFusion Solution ID'
      #   inputs:
      #     ConnectedServiceName: '${{ parameters.Subscription }}'
      #     resourceGroupName: '$(RG_APP_NAME)'
      #     KeyVaultName: $(KV_NAME)
      #     SecretName: 'VFSolutionID'
      #     SecretValue: $(SolutionID)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion SubscriptionKey'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFSubscriptionKey'
          SecretValue: $(SubscriptionKey)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion URI'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFUri'
          SecretValue: $(Uri)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion Token Endpoint'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFTokenEndpoint'
          SecretValue: $(TokenEndpoint)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: DB Connection String'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'DBConnectionString'
          SecretValue: $(DbConnectionString)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: Service Bus Connection String'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'ServiceBusConnectionString'
          SecretValue: $(ServiceBusConnectionString)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: MI Client ID'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'MIClientId'
          SecretValue: $(MIClientId)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: Azure Service Bus FQ URL'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'AzureServiceBusFQURL'
          SecretValue: $(AzureServiceBusFullyQualifiedURL)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: Azure Service Bus Primary shared access'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'ServiceBusPSAKConnectionString'
          SecretValue: $(ServiceBusPSAKConnectionString)      
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: Azure Service Bus Secondary shared access'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'ServiceBusSSAKConnectionString'
          SecretValue: $(ServiceBusSSAKConnectionString) 

      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: Number of retries on message failure'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'NumberOfRetriesOnFailure'
          SecretValue: $(NumberOfRetriesOnFailure) 

      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: Number of delayed retries on message failure'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'NumberOfDelayedRetriesOnFailure'
          SecretValue: $(NumberOfDelayedRetriesOnFailure) 

      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: Delay seconds between failed message retries'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'DelayBetweenRetriesInSeconds'
          SecretValue: $(DelayBetweenRetriesInSeconds) 

      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: Failed message queue'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'FailedMessageEndpoint'
          SecretValue: $(FailedMessageEndpoint)
     
      - task: cboroson-WriteSecrets@1
        displayName: 'Write NServiceBus License to Azure Key Vault'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: '$(KV_NAME)'
          SecretName: 'NServiceBusLicense'
          SecretValue: '$(NSB_LICENSE)'

      - task: cboroson-WriteSecrets@1
        displayName: 'Write SAPassword Secret to Azure Key Vault'
        condition: and(succeeded(), eq(variables['EnableCCPPassword'], 'true'))
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: '$(KV_NAME)'
          SecretName: '$(KVSecretName)'
          SecretValue: '$(SAPassword)'

      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: VentureFusion Usage ID'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'VFUsageID'
          SecretValue: $(UsageID)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: DocIDApiEndpointUrl'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'DocIDApiEndpointUrl'
          SecretValue: $(DocIDApiEndpointUrl)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: DocSoapAction'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'DocSoapAction'
          SecretValue: $(DocSoapAction)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: DocSubscriptionKey'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'DocSubscriptionKey'
          SecretValue: $(DocSubscriptionKey)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: DocSoapEnvelope'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'DocSoapEnvelope'
          SecretValue: $(DocSoapEnvelope)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: BearerServiceAccountClientId'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'BearerServiceAccountClientId'
          SecretValue: $(BearerServiceAccountClientId)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: BearerTokenEndpoint'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'BearerTokenEndpoint'
          SecretValue: $(BearerTokenEndpoint)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: BearerTokenScope'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'BearerTokenScope'
          SecretValue: $(BearerTokenScope)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: MultiDocSoapAction'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'MultiDocSoapAction'
          SecretValue: $(MultiDocSoapAction)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: MultiDocSoapEnvelope'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'MultiDocSoapEnvelope'
          SecretValue: $(MultiDocSoapEnvelope)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: DocIdCount'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'DocIdCount'
          SecretValue: $(DocIdCount)
      # - task: cboroson-WriteSecrets@1
      #   displayName: 'Write Secret: Solution ID for PGA Welcome Letter'
      #   inputs:
      #     ConnectedServiceName: '${{ parameters.Subscription }}'
      #     resourceGroupName: '$(RG_APP_NAME)'
      #     KeyVaultName: $(KV_NAME)
      #     SecretName: 'VFPGAWLSolutionID'
      #     SecretValue: $(PGAWLSolutionID)
      # - task: cboroson-WriteSecrets@1
      #   displayName: 'Write Secret: Solution ID for PGA Welcome Kit'
      #   inputs:
      #     ConnectedServiceName: '${{ parameters.Subscription }}'
      #     resourceGroupName: '$(RG_APP_NAME)'
      #     KeyVaultName: $(KV_NAME)
      #     SecretName: 'VFPGAWKSolutionID'
      #     SecretValue: $(PGAWKSolutionID)
      - task: cboroson-WriteSecrets@1
        displayName: 'Write Secret: DocID Threshold value'
        inputs:
          ConnectedServiceName: '${{ parameters.Subscription }}'
          resourceGroupName: '$(RG_APP_NAME)'
          KeyVaultName: $(KV_NAME)
          SecretName: 'DocIDThreshold'
          SecretValue: $(DocIDThreshold)

  - stage: DEMO
    pool: Release-Corporate-NP
    variables:
    - template: Variables/VentureFusionNP.yml
    - template: Variables/KeyVault_Demo.yml    
    jobs:
    # Write Key Vault Secrets
    - job: DEMOWriteKeyVaultSecrets
      steps:
      - checkout: self
        displayName: 'Checkout Repository'
      - task: TruStageReleaseTask@1
        displayName: 'Retrieve Primary Service Account Password from CCP'
        inputs:
          enableCCP: true
          CCPObject: '$(PrimaryCCPObject)'
          CCPSafe: '$(PrimaryCCPSafe)'
          CCPAPPID: '$(PrimaryCCPAppID)'
          CCPReason: 'Retrieve password for release management deployment'
          PasswordVariableName: 'rmSaPwd'
      - task: CCPSAPasswordLookup@1
        displayName: 'Retrieve Secondary Service Account Password from CCP'
        inputs:
          ReleaseUsername: 'cmutual\$(PrimaryServiceAccount)'
          ReleasePassword: '$(rmSaPwd)'
          enableCCP: true
          CCPObject: '$(SecondaryCCPObject)'
          CCPSafe: '$(SecondaryCCPSafe)'
          CCPAPPID: '$(SecondaryCCPAppID)'
          CCPReason: 'Retrieve password to connect Documentum Soap Service'
          PasswordVariableName: 'SAPassword'  
      - task: DownloadSecureFile@1
        name: PGPPrivateKey
        displayName: 'Download PGP Private Key Non Prod'
        inputs:
          secureFile: '$(PvtKeyFilename)'
      - task: DownloadSecureFile@1
        name: PGPPublicKey
        displayName: 'Download PGP Public Key Non Prod'
        inputs:
          secureFile: '$(PubKeyFilename)'
      - task: DownloadSecureFile@1
        name: PGPPassphrase
        displayName: 'Download PGP Passphrase Non Prod'
        inputs:
          secureFile: '$(PassphraseFilename)'
      - task: DownloadSecureFile@1
        name: NServiceBusLicense
