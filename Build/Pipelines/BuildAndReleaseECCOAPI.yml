- stage: PROD
  displayName: 'Deploy App to PROD Staging Slot'
  dependsOn: DEMO
  variables:
    - template: Variables/AzureDeployPROD.yml
  jobs:
  - deployment: DeployPRODWebApp
    displayName: 'Deploy to staging PROD slot'
    environment: 'ECCO-Prod'
    pool:
      name: Azure Pipelines    
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: 30f35852-3f7e-4c0c-9a88-e127b4f97211@1
            inputs:
              alias: current
              artifact: drop
          - task: AzureRmWebAppDeployment@5
            displayName: 'Azure App Service Deploy: $(AppName)'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'Corporate Prod Corporate'
              appType: 'webApp'
              WebAppName: '$(AppName)'
              ResourceGroupName: '$(RGName)'
              packageForLinux: '$(Pipeline.Workspace)/drop/ProcessRequestEndPoint.zip'
              enableCustomDeployment: true
              DeploymentType: 'webDeploy'
              TakeAppOfflineFlag: true
              RemoveAdditionalFilesFlag: true
              deployToSlotOrASE: true
              SlotName: 'staging'
          - task: AzureCLI@2
            displayName: 'Restart Azure App Service'
            inputs:
              azureSubscription: 'Corporate Prod Corporate'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $resourceGroup = "$(RGName)"
                $appName = "$(AppName)"
                az webapp restart --resource-group $resourceGroup --name $appName --slot staging
          - task: AzureAppServiceManage@0
            displayName: 'Swap PROD Staging and Production Slots'
            inputs:
              azureSubscription: 'Corporate Prod Corporate'
              Action: 'Swap Slots'
              WebAppName: '$(AppName)'
              ResourceGroupName: '$(RGName)'
              SourceSlot: 'staging'
              TargetSlot: 'production'
          - task: AzureCLI@2
            displayName: 'Restart Azure App Service'
            inputs:
              azureSubscription: 'Corporate Prod Corporate'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $resourceGroup = "$(RGName)"
                $appName = "$(AppName)"
                az webapp restart --resource-group $resourceGroup --name $appName
  - job: DeployPRODDynatraceReleaseEvent
  - template: Utility/Dynatrace/DynatraceReleaseEvents.yml@templates
    parameters:
      VariableGroupName: 'Dynatrace API'
      AzureSubscription: 'Corporate Prod Corporate'
      DynatraceReleaseTag: 'Service:$(AppName)'
      DynaEnvironment: '$(DYNATRACE_ENV)'

- stage: SwapSlots_PROD
  displayName: 'Swap PROD Staging to Production'
  #dependsOn: PROD
  variables:
    - template: Variables/AzureDeployPROD.yml
  jobs:
  - deployment: DeployPRODWebApp
    displayName: 'Deploy to PROD'
    environment: 'ECCO-Prod'
    pool:
      name: Azure Pipelines    
      vmImage: 'windows-latest'
      strategy:
      runOnce:
        deploy:
         steps:
          - task: AzureAppServiceManage@0
            displayName: 'Swap PROD Staging and Production Slots'
            inputs:
              azureSubscription: 'Corporate Prod Corporate'
              Action: 'Swap Slots'
              WebAppName: '$(AppName)'
              ResourceGroupName: '$(RGName)'
              SourceSlot: 'staging'
              TargetSlot: 'production'
          - task: AzureCLI@2
            displayName: 'Restart Azure App Service'
            inputs:
              azureSubscription: 'Corporate Prod Corporate'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $resourceGroup = "$(RGName)"
                $appName = "$(AppName)"
                az webapp restart --resource-group $resourceGroup --name $appName

  - job: DeployPRODDynatraceReleaseEvent
  - template: Utility/Dynatrace/DynatraceReleaseEvents.yml@templates
    parameters:
      VariableGroupName: 'Dynatrace API'
      AzureSubscription: 'Corporate Prod Corporate'
      DynatraceReleaseTag: 'Service:$(AppName)'
      DynaEnvironment: '$(DYNATRACE_ENV)'