#
#Delete API to DEV
#
- stage: DeleteAPIToDev
  displayName: 'Delete API to Dev'
  dependsOn: ''
  variables:
  - template: Variables/APIM_Dev.yml
  jobs:
  - deployment: deleteapi
    displayName: 'Delete API To Dev'
    environment: APIM-DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - checkout: AzureAPIM
          - task: ReplaceTokens@1
            inputs:
              sourcePath: '$(FolderPath)'
              filePattern: '*'
              tokenRegex: '__(\w+)__'
          - task: AzurePowerShell@5
            displayName: 'Delete API'
            inputs:
              azureSubscription: 'Corporate NonProd Corporate'
              ScriptType: 'FilePath'
              ScriptPath: '$(System.DefaultWorkingDirectory)/AzureAPIM/RemoveAPI.ps1'
              ScriptArguments: '-APIName "CommManagerAPI" -ApiVersion "$(ApimVersionToDelete)" -Environment "$(Environment)"'
              azurePowerShellVersion: 'LatestVersion'
