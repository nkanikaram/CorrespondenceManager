# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none
  

pool: 
  vmImage: windows-latest

resources:
 repositories:
   - repository: self
   - repository: AzureAPIM
     name: Internal Open Source/AzureAPIM
     type: git
     ref: main

variables:
  - template: Variables/APIM_Release.yml

stages:
#
# Deploy API to DEV
#
- stage: DeployAPIToDev
  displayName: 'Deploy API to Dev'
  variables:
  - template: Variables/APIM_Dev.yml
  jobs:
  - deployment: deployapidef
    displayName: 'Deploy API To Dev'
    environment: APIM-DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - checkout: AzureAPIM
          - task: ReplaceTokens@1
            inputs:
              sourcePath: '$(FolderPath)'
              filePattern: '*'
              tokenRegex: '__(\w+)__'
          - task: AzurePowerShell@5
            displayName: 'Create API'
            inputs:
              azureSubscription: 'Corporate NonProd Corporate'
              ScriptType: 'FilePath'
              ScriptPath: '$(System.DefaultWorkingDirectory)/AzureAPIM/CreateApiFromDefinitions.ps1'
              ScriptArguments: '-FileName "$(API_Def)" -Environment "$(Environment)"'
              azurePowerShellVersion: 'LatestVersion'
          - task: AzurePowerShell@5
            displayName: 'Create Policy'
            inputs:
              azureSubscription: 'Corporate NonProd Corporate'
              ScriptType: 'FilePath'
              ScriptPath: '$(System.DefaultWorkingDirectory)/AzureAPIM/DeployPolicy.ps1'
              ScriptArguments: '-FileName "$(API_Def)" -Environment "$(Environment)" -PolicyFolderPath "$(FolderPath)"'
              azurePowerShellVersion: 'LatestVersion'
          - task: AzurePowerShell@5
            displayName: 'Create Product'
            inputs:
              azureSubscription: 'Corporate NonProd Corporate'
              ScriptType: 'FilePath'
              ScriptPath: '$(System.DefaultWorkingDirectory)/AzureAPIM/CreateProduct.ps1'
              ScriptArguments: '-FileName "$(Product_def)" -Environment "$(Environment)" -FolderPath "$(FolderPath)"'
              azurePowerShellVersion: 'LatestVersion'
          - task: AzurePowerShell@5
            displayName: 'Add API to Product'
            inputs:
              azureSubscription: 'Corporate NonProd Corporate'
              ScriptType: 'FilePath'
              ScriptPath: '$(System.DefaultWorkingDirectory)/AzureAPIM/AddApiToProduct.ps1'
              ScriptArguments: '-FileName "$(Product_def)" -Environment "$(Environment)" -FolderPath "$(FolderPath)"'
              azurePowerShellVersion: 'LatestVersion'
          - task: AzurePowerShell@5
            displayName: 'Add Group to Product'
            inputs:
              azureSubscription: 'Corporate NonProd Corporate'
              ScriptType: 'FilePath'
              ScriptPath: '$(System.DefaultWorkingDirectory)/AzureAPIM/AddGroupToProduct.ps1'
              ScriptArguments: '-FileName "$(Product_def)" -Environment "$(Environment)" -FolderPath "$(FolderPath)"'
              azurePowerShellVersion: 'LatestVersion'

