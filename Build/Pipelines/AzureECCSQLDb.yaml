trigger: none

pool: Atlashostedagents

resources:
  repositories:
  - repository: Atlas
    type: git
    name: SecureCloudEnablement/Atlas
    ref: Releases/Current/Latest
  - repository: ECCO-CommunicationManager
    type: git
    name: CorporateServices/ECCO-CommunicationManager
    ref: main

parameters:
  - name: Environment
    displayName: "Environment to deploy"
    type: string
    default: DVLP
    values:
      - DVLP
      - DEMO
      - PROD
  - name: Subscription
    displayName: "Subscriptions to use"
    type: string
    default: Corporate NonProd Corporate
    values:
      - Corporate NonProd Corporate
      - Corporate Prod Corporate

variables:
  - ${{ if eq(parameters.Environment, 'DVLP') }}:
    - name: RG_ENVCODE
      value: D02
    - name: SQL_DATABASE_SERVICEOBJECTIVE
      value: 'basic'
    - name: SQL_PERMISSIONS_FILE
      value: '$(selfSrcRoot)/Build/Pipelines/SqlPermissionsDVLP.json'
  - ${{ if eq(parameters.Environment, 'DEMO') }}:
    - name: RG_ENVCODE
      value: M01
    - name: SQL_DATABASE_SERVICEOBJECTIVE
      value: 'S1'
    - name: SQL_PERMISSIONS_FILE
      value: '$(selfSrcRoot)/Build/Pipelines/SqlPermissionsDEMO.json'
  - ${{ if eq(parameters.Environment, 'PROD') }}:
    - name: RG_ENVCODE
      value: P01
    - name: SQL_DATABASE_SERVICEOBJECTIVE
      value: 'S2'
    - name: SQL_PERMISSIONS_FILE
      value: '$(selfSrcRoot)/Build/Pipelines/SqlPermissionsPROD.json'

  - name: atlasSrcCheckoutPath
    value: 's/Atlas'
  - name: atlasSrcRoot
    value: '$(Agent.BuildDirectory)/s/Atlas'
  - name: RG_APP_NAME
    value: 'RG-CMFG-$(RG_ENVCODE)-ECCDB'
  - name: LOCATION
    value: 'East US 2'
  - name: RG_ASSET_TAG
    value: '000095520'
  - name: RG_ROLE_GROUP
    value: 'R-App-ECCO-Developers-LSA'
  - name: RG_NOTIFICATION_EMAIL_LIST
    value: 'DS-ECCO@trustage.com'
  - name: RELEASE_REQUESTEDFOREMAIL
    value: 'MB-ECCO'
  - name: APP_RG_NAME
    value: '$(RG_APP_NAME)'
  - name: SQL_RESOURCE_GROUP
    value: '$(RG_APP_NAME)'
  - name: SQL_SERVER_NAME
    value: 'sql-eccdb-$(RG_ENVCODE)'
  - name: SQL_DATABASE_NAME
    value: 'ECCDB-$(RG_ENVCODE)'
  - name: IDENTITY_NAME
    value: 'MI-$(RG_ENVCODE)-ECCO'
  - name: selfSrcCheckoutPath
    value: s/ECCO-CommunicationManager
  - name: selfSrcRoot
    value: $(Agent.BuildDirectory)/s/ECCO-CommunicationManager
  - name: NOTIFICATION_EMAIL_LIST
    value: '$(RG_NOTIFICATION_EMAIL_LIST)'
  - name: DataSource
    value: 'sql-eccdb-$(RG_ENVCODE).database.windows.net'
  - name: DataBase
    value: 'ECCDB-$(RG_ENVCODE)'
  - name: selfSrcCheckoutPath
    value: s/ECCO-CommunicationManager
  - name: selfSrcRoot
    value: $(Agent.BuildDirectory)/s/ECCO-CommunicationManager
  - name: SQL_FILE
    value: '$(selfSrcRoot)/Build/DBScripts/ECCODBTableScript.sql'
  - name: SOURCE_RESOURCE_NAME
    value: 'AS-CMFG-$(RG_ENVCODE)-ECCO'
  - name: SOURCE_RESOURCE_GROUP
    value: 'RG-CMFG-$(RG_ENVCODE)-ECCO'
    
stages:
  - stage: DVLP
    jobs:
    # # Deploy Resource Group
    - job: DVLPResourceGroup
      steps:
      - checkout: Atlas
        displayName: 'Get Atlas scripts'
        path: $(atlasSrcCheckoutPath)
      - task: deployAzureResourceGroup@3
        displayName: 'CMFG Deploy Azure Resource Group.'
        inputs:
          ConnectedServiceNameARM: '${{ parameters.Subscription }}'
          rgType: standard
          enableForAtlas: atlasTrue
          ResourceGroupName: '$(RG_APP_NAME)'
          appDescription: 'ECCO DB Resource Group'
          environmentCode: '$(RG_ENVCODE)'
          cmdbAssetTag: '$(RG_ASSET_TAG)'
          roleGroup: '$(RG_ROLE_GROUP)'
          atlasEmailGroup: '$(RG_NOTIFICATION_EMAIL_LIST)'
          atlaslocation: '$(LOCATION)'
    # # Deploy Database server
    - job: DeployAzureSQLServer
      dependsOn: DVLPResourceGroup
      pool: AtlasHostedAgents 
      displayName: 'Deploy Azure SQL Server'
      steps:
        - checkout: Atlas
          displayName: 'Get Atlas scripts'
          path: $(atlasSrcCheckoutPath)  
        - checkout: self
          displayName: 'Get Repo script SqlPermissions file'
          path: $(selfSrcCheckoutPath)  
        - task: AzurePowerShell@5
          displayName: 'Check Resource Group Exists'
          inputs:
            azureSubscription: '${{parameters.Subscription}}'
            ScriptType: 'InlineScript'
            Inline: |
              $rgName = "$(SQL_RESOURCE_GROUP)"
              $rg = Get-AzResourceGroup -Name $rgName -ErrorAction SilentlyContinue
              if (-not $rg) {
                Write-Error "Resource group '$rgName' does not exist. Aborting SQL Server deployment."
                exit 1
              } else {
                Write-Host "Resource group '$rgName' exists. Proceeding..."
              }
            azurePowerShellVersion: LatestVersion
          enabled: true
        - task: AzurePowerShell@5
          displayName: 'Deploy Azure SQL Server'
          inputs:
            azureSubscription: '${{parameters.Subscription}}'
            ScriptType: 'FilePath'
            ScriptPath: '$(atlasSrcRoot)/Deploy/AzureSQL/deployAzureSQLServer.ps1'
            azurePowerShellVersion: LatestVersion
          enabled: true
    # Deploy Database
    - job: DeployAzureSQLDatabase
      dependsOn: DeployAzureSQLServer
      displayName: 'Deploy Azure SQL Database'
      steps:
        - checkout: Atlas
          displayName: 'Get Atlas scripts'
          path: $(atlasSrcCheckoutPath)  
        - checkout: self
          displayName: 'Get Repo script SqlPermissions file'
          path: $(selfSrcCheckoutPath)      
        - task: AzurePowerShell@5
          displayName: 'Check SQL Server Exists'
          inputs:
            azureSubscription: '${{ parameters.Subscription }}'
            ScriptType: 'InlineScript'
            Inline: |
              $serverName = "$(SQL_SERVER_NAME)"
              $rgName = "$(SQL_RESOURCE_GROUP)"
              $server = Get-AzSqlServer -ResourceGroupName $rgName -ServerName $serverName -ErrorAction SilentlyContinue
              if (-not $server) {
                Write-Error "SQL Server '$serverName' does not exist. Aborting SQL Database deployment."
                exit 1
              } else {
                Write-Host "SQL Server '$serverName' exists. Proceeding..."
              }
            azurePowerShellVersion: LatestVersion
          enabled: true
        - task: AzurePowerShell@5
          displayName: 'Deploy Azure SQL Database'
          inputs:
            azureSubscription: '${{parameters.Subscription}}'
            ScriptType: 'FilePath'
            ScriptPath: '$(atlasSrcRoot)/Deploy/AzureSQL/deployAzureSQLDatabase.ps1'
            azurePowerShellVersion: LatestVersion
          enabled: true
    #############################
    ##Set database permissions ##
    #############################
        - script: echo "SqlPermissions json file path is  $(SQL_PERMISSIONS_FILE)"
          displayName: 'Output SQL Database Confirmation'
        - script: dir $(selfSrcRoot)/Build/Pipelines
          displayName: 'List files in pipelines folder in selfsrcRoot'        
        - task: AzurePowerShell@5
          displayName: 'Deploy Azure SQL Database Permissions'
          inputs:
            azureSubscription: '${{parameters.Subscription}}'
            scriptType: 'FilePath'
            scriptPath: '$(atlasSrcRoot)/Deploy/AzureSQL/operations/Atlas-ApplySqlPermissions.ps1'
            scriptArguments: '-sqlServer "$(SQL_SERVER_NAME)" -sqlDatabase "$(SQL_DATABASE_NAME)" -sqlPermissionsFile "$(SQL_PERMISSIONS_FILE)"'
            azurePowerShellVersion: LatestVersion
          enabled: true
    - job: DeployTableSchema
      dependsOn: DeployAzureSQLDatabase
      displayName: 'Table creation in DVLP Database'
      pool: Release-NonProd-Corporate-2016
      steps:
        - checkout: ECCO-CommunicationManager
          displayName: 'Get ECCO-CommunicationManager repo'
          path: $(selfSrcCheckoutPath)  
        - task: CmfgReleaseTask@1
          displayName: 'CMFG Release Task'
          inputs:
            AIMObject: 'Non-Managed Accounts-Non-Managed AIM Accounts-SA-RM-Corporate-P'
            AIMSafe: 'SVR-WIN-CMU-AIM-ALL'
            AIMReason: 'Release Management deployment'
            PasswordVariableName: 'svr_password'
            SearchBlacklistedFiles: false
            SearchBlacklistedConfig: false
            SearchBlacklistedDbCommand: false
            IncludeArchiveFiles: false
        - task: SqlAzureDacpacDeployment@1
          displayName: 'Azure SQL deploy Task'
          inputs:
            azureSubscription: '${{ parameters.Subscription }}' 
            AuthenticationType: aadAuthenticationPassword
            ServerName: '$(DataSource)' 
            DatabaseName: '$(DataBase)'
            aadSqlUsername: 'SA-RM-Corporate-P@cmutual.com'
            aadSqlPassword: '$(svr_password)'
            deployType: SqlTask
            SqlFile: $(SQL_FILE)
