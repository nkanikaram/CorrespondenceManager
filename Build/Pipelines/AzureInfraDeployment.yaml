    # Deploy AGWAF & App Service with deployment slots
    - job: PRODWebApp
      dependsOn: DeployPRODAppServicePlan
      steps:
      - checkout: Atlas
        displayName: 'Get Atlas scripts'
        path: $(atlasSrcCheckoutPath)
      - checkout: self
        displayName: 'Get policy overrides json files'
        path: $(selfSrcCheckoutPath) 
      - task: AzurePowerShell@5
        displayName: 'Deploy AGWAF'
        inputs:
