              --set properties.siteConfig.healthCheckPath=$healthCheckPath       
    # Add Atlas Allowed Subnets to Key Vault
    - job: AddAtlasAllowedSubnets
      dependsOn: PRODWebApp
      steps:
        - checkout: Atlas
          displayName: 'Get Atlas scripts'
          path: $(atlasSrcCheckoutPath)
        - task: AzurePowerShell@5
          inputs:
            azureSubscription: '${{ parameters.Subscription }}'
            ScriptType: 'FilePath'
            ScriptPath: '$(atlasSrcRoot)/Deploy/Common/AddAtlasAllowedSubnet.ps1'
            ScriptArguments: '-targetResourceName $(KV_NAME) -targetResourceGroup $(RG_APP_NAME) -sourceResourceName $(APP_NAME) -sourceResourceGroup $(RG_APP_NAME)'
            azurePowerShellVersion: 'LatestVersion'