        displayName: 'Deploy RoleGroup Permissions'
        inputs:
          azureSubscription: '${{ parameters.Subscription }}'
          ScriptType: 'FilePath'
          ScriptPath: '$(atlasSrcRoot)/Deploy/KeyVault/operations/addAccessPolicy.ps1'
          ScriptArguments: '-VaultName $(KV_NAME) -Identity $(RG_ROLE_GROUP)'
          azurePowerShellVersion: 'LatestVersion'
    # Deploy App Service Plan
    - job: DeployPRODAppServicePlan
