trigger: none

pool:
  name: 'AtlasHostedAgents'

parameters:
  - name: Environment
    displayName: "Environment to deploy"
    type: string
    default: DVLP
    values:
      - DVLP
      - DEMO
      - PROD
  - name: Subscription
    displayName: "Subscriptions to use"
    type: string
    default: Corporate NonProd Corporate
    values:
      - Corporate NonProd Corporate
      - Corporate Prod Corporate

#Define variables for different environments
variables:   
  - ${{ if eq(parameters.Environment, 'DVLP') }}:
    - name: RG_ENVCODE
      value: D01
    - name: APP_ENV_PREFIX
      value: NP1 
  - ${{ if eq(parameters.Environment, 'DEMO') }}:
    - name: RG_ENVCODE
      value: M01
    - name: APP_ENV_PREFIX
      value: NP1
  - ${{ if eq(parameters.Environment, 'PROD') }}:
    - name: RG_ENVCODE
      value: P01
    - name: APP_ENV_PREFIX
      value: PR1
  - name: atlasSrcCheckoutPath
    value: 's/Atlas'
  - name: atlasSrcRoot
    value: '$(Agent.BuildDirectory)/s/Atlas'
  - name: RG_APP_NAME
    value: 'RG-CMFG-$(APP_ENV_PREFIX)-Servicebus-ECCO-$(RG_ENVCODE)'
  - name: LOCATION
    value: 'East US 2'
  - name: RG_ASSET_TAG
    value: '000095520'
  - name: RG_ROLE_GROUP
    value: 'R-App-ECCO-Developers-LSA'
  - name: RG_NOTIFICATION_EMAIL_LIST
    value: 'DS-ECCO'
  - name: BUS_NAMESPACE
    value: 'NSB-ECCO-Namespace-$(RG_ENVCODE)'
  - name: SOURCE_RESOURCE_NAME
    value: 'AS-CMFG-$(RG_ENVCODE)-ECCO'
  - name: SOURCE_RESOURCE_GROUP
    value: 'RG-CMFG-$(RG_ENVCODE)-ECCO'
  - name: KV_NAME
    value: 'kv-NSB-$(RG_ENVCODE)-ecco'
  - name: IDENTITY_NAME
    value: 'MI-$(RG_ENVCODE)-ECCO'
  - name: NSB_QUEUE_ENDPOINT
    value: 'ecco-shared-queue'
  - name: NSB_TOPIC_ENDPOINT
    value: 'ecco-shared-topic'

resources:
  repositories:
    - repository: Atlas
      type: git
      name: SecureCloudEnablement/Atlas
      ref: Releases/Current/Latest

#Define stages for deploying infrastructure
stages:
- stage: DeployInfra
  displayName: 'Deploy ${{ parameters.Environment }} Infra'
  jobs:
    - job: ResourceGroup
      displayName: 'Deploy Resource Group'
      steps:
        - checkout: Atlas
          displayName: 'Get Atlas scripts'
          path: $(atlasSrcCheckoutPath)

          #Deploy Resource Group
        - task: deployAzureResourceGroup@3
          displayName: 'Deploy Azure Resource Group'
          inputs:
            ConnectedServiceNameARM: '${{ parameters.Subscription }}'
            rgType: standard
            enableForAtlas: atlasTrue
            ResourceGroupName: '$(RG_APP_NAME)'
            appDescription: 'ECCO Resource Group'
            environmentCode: '$(RG_ENVCODE)'
            cmdbAssetTag: '$(RG_ASSET_TAG)'
            roleGroup: '$(RG_ROLE_GROUP)'
            atlasEmailGroup: '$(RG_NOTIFICATION_EMAIL_LIST)'
            atlaslocation: '$(LOCATION)'

